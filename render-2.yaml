services:
  - type: web
    name: ai-receptionist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn cloud_server_v2:app --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: RESTAURANT_NAME
        value: Kebabish Original
      - key: OWNER_PHONE
        sync: false
